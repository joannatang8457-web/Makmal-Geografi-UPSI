            touch-action: none; 
            user-select: none; 
            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
            max-width: 100%;
            max-height: 100%;

        }

            height: 100%;

        }

            left: 0;

            height: 100%;

        }

</head>

const CANVAS = document.getElementById('gameCanvas');
const CTX = CANVAS.getContext('2d');
const MASK_CANVAS = document.createElement('canvas');
const MASK_CTX = MASK_CANVAS.getContext('2d', { willReadFrequently: true });

// ==================== ⚡ 调整速度：第一关稍微调慢，保持关卡递增节奏 ====================
const LEVEL_CONFIG = {
    1: { p_speed: 2.5, g_speed: 1.1 },  // 第一关：鬼速度从1.3降到1.1，更适中
    2: { p_speed: 2.8, g_speed: 1.4 },  // 第二关：相应调整
    3: { p_speed: 3.2, g_speed: 1.7 }   // 第三关：最高难度
};

const PLAYER_SIZE = 24;
const HITBOX_SIZE = 14;
const GHOST_SIZE = 30;
const GRID_SIZE = 60;
const ANIMATION_SPEED = 200;
const WIN_COLOR = { r: 84, g: 128, b: 100 };

let currentLang = 'CN';
let currentLevel = 1;
let gameRunning = false;
let isPaused = false;
let lives = 3;
let totalDots = 0;
let collectedDots = 0;
let frameId;
let musicPlaying = false;
let animationFrame = 0;
let lastAnimationTime = 0;
let isMoving = false;

// ==================== 🔧 死亡状态标记：确保只触发一次 ====================
let player = { 
    x: 0, 
    y: 0, 
    dx: 0, 
    dy: 0, 
    invulnerable: 0, 
    angle: 0,
    isDead: false
};
let ghosts = [];
let dots = [];
let bigStars = [];
let keys = {};
let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };

let bgImg, maskImg, levelStoryImgs = [];
let playerImgs = { up: [], down: [], left: [], right: [] };
let ghostImgs = { up: [], down: [], left: [], right: [] };
let bgMusicElement;

const SFX = {
    collision: new Audio('sfx_collision.mp3'),
    bigStar: new Audio('sfx_bigstar.mp3'),
    gameOver: new Audio('sfx_gameover.mp3'),
    gameWin: new Audio('sfx_gamewin.mp3'),
    dot: new Audio('sfx_dot.mp3'),
    volume: 0.4
};

function getText(key) {
    return TEXT_DATA[currentLang][key] || key;
}

function playSound(soundName) {
    if (!SFX[soundName]) return;
    
    const sound = SFX[soundName];
    
    if (bgMusicElement && musicPlaying && !bgMusicElement.paused) {
        if (soundName === 'gameOver' || soundName === 'gameWin' || soundName === 'collision') {
            bgMusicElement.pause();
        }
    }
    
    sound.currentTime = 0;
    sound.play().catch(e => console.log(`音效播放失败: ${soundName}`, e));
    
    sound.onended = () => {
        if (bgMusicElement && musicPlaying && soundName !== 'gameOver' && soundName !== 'gameWin') {
            bgMusicElement.play().catch(e => console.log('恢复音乐失败', e));
        }
    };
}

function toggleMusic() {
    if (!bgMusicElement) return;
    const btn = document.getElementById('music-btn');
    if (!btn) return;
    
    if (musicPlaying) {
        bgMusicElement.pause();
        btn.textContent = '🔇';
    } else {
        bgMusicElement.play().catch(e => {
            console.log('音乐播放失败:', e);
            alert('音乐播放失败，请确保bgm.mp3文件存在');
        });
        btn.textContent = '🎵';
    }
    musicPlaying = !musicPlaying;
}

function selectLang(lang) {
    currentLang = lang;
    const startScreen = document.getElementById('start-screen');
    if (startScreen) {
        startScreen.classList.add('hidden');
    }
    initLevel(1);
}

function initLevel(lvl) {
    // ==================== 🔧 重置死亡状态 ====================
    player.isDead = false;
    currentLevel = lvl;
    isPaused = true;
    gameRunning = false;

    bgImg = new Image();
    maskImg = new Image();
    bgImg.loaded = false;
    maskImg.loaded = false;

    let loadedCount = 0;
    
    const checkAllLoaded = () => {
        loadedCount++;
        if (loadedCount >= 2) {
            console.log(`关卡 ${lvl} 资源加载完成，准备初始化世界...`);
            setupGameWorld();
        }
    };

    const timestamp = Date.now();
    const bgUrl = `bg_level${lvl}.jpg?v=${timestamp}`;
    const maskUrl = `mask_level${lvl}.jpg?v=${timestamp}`;

    console.log(`🔄 开始加载关卡 ${lvl} 资源...`);
    console.log(`   背景图: ${bgUrl}`);
    console.log(`   遮罩图: ${maskUrl}`);

    bgImg.onload = async () => {
        try {
            await bgImg.decode();
            bgImg.loaded = true;
            console.log(`✅ 背景图解码成功: Level ${lvl}`);
        } catch(e) {
            console.error(`❌ 背景图解码失败: ${e.message}`);
            bgImg.loaded = false;
        }
        checkAllLoaded();
    };

    maskImg.onload = async () => {
        try {
            await maskImg.decode();
            maskImg.loaded = true;
            console.log(`✅ 遮罩图解码成功: Level ${lvl}`);
        } catch(e) {
            console.error(`❌ 遮罩图解码失败: ${e.message}`);
            maskImg.loaded = false;
        }
        checkAllLoaded();
    };

    bgImg.onerror = () => {
        console.error(`❌ 背景图加载失败: ${bgUrl}`);
        console.error(`   请检查文件路径: ${window.location.href}bg_level${lvl}.jpg`);
        bgImg.loaded = false;
        checkAllLoaded();
    };

    maskImg.onerror = () => {
        console.error(`❌ 遮罩图加载失败: ${maskUrl}`);
        console.error(`   请检查文件路径: ${window.location.href}mask_level${lvl}.jpg`);
        maskImg.loaded = false;
        checkAllLoaded();
    };

    bgImg.src = bgUrl;
    maskImg.src = maskUrl;
}

function nextLevel() {
    const resultModal = document.getElementById('result-modal');
    if (resultModal) resultModal.classList.add('hidden');
    if (currentLevel < 3) {
        initLevel(currentLevel + 1);
    } else {
        showEndingScreen();
    }
}

function setupCanvasScaling() {
    const container = document.getElementById('canvas-container');
    const originalWidth = CANVAS.width;
    const originalHeight = CANVAS.height;
    
    function resizeCanvas() {
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        const scale = Math.min(screenWidth / originalWidth, screenHeight / originalHeight);
        
        const newWidth = Math.floor(originalWidth * scale);
        const newHeight = Math.floor(originalHeight * scale);
        
        container.style.width = newWidth + 'px';
        container.style.height = newHeight + 'px';
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
}

function setupGameWorld() {
    if (!bgImg || !maskImg) {
        console.error('❌ 图片未初始化');
        return;
    }
    
    CANVAS.width = MASK_CANVAS.width = bgImg.naturalWidth || 800;
    CANVAS.height = MASK_CANVAS.height = bgImg.naturalHeight || 600;
    
    console.log(`📐 设置画布尺寸: ${CANVAS.width}x${CANVAS.height}`);
    
    if (maskImg.loaded && maskImg.complete) {
        try {
            MASK_CTX.drawImage(maskImg, 0, 0);
            console.log('✅ 遮罩图已绘制到MASK_CTX');
        } catch(e) {
            console.error('❌ 遮罩图绘制失败:', e);
            createFallbackMask();
        }
    } else {
        console.warn('⚠️ 遮罩图未加载，创建备用遮罩');
        createFallbackMask();
    }
    
    CTX.imageSmoothingEnabled = false;
    setupCanvasScaling();

    let startPos = findSafeSpot(100, CANVAS.height/2, HITBOX_SIZE);
    player.x = startPos.x;
    player.y = startPos.y;
    player.invulnerable = 0;
    player.angle = 0;
    player.isDead = false;

    ghosts = [];
    // ==================== ⚡ 难度升级：第一关有2个鬼，第二关3个，第三关4个 ====================
    let ghostCount = currentLevel + 1;
    
    for(let i = 0; i < ghostCount; i++) {
        // ==================== ⚡ 位置调整：鬼魂更靠近中心"隘口" ====================
        let ghostSpawnX = CANVAS.width / 2 + 150 + i * 120;
        let ghostSpawnY = CANVAS.height / 2 - 100 + i * 80;
        
        let gPos = findSafeSpot(ghostSpawnX, ghostSpawnY, HITBOX_SIZE);
        
        let attempts = 0;
        while(checkCollision(gPos.x, gPos.y, HITBOX_SIZE) && attempts < 50) {
            gPos.x = ghostSpawnX + (Math.random() - 0.5) * 100;
            gPos.y = ghostSpawnY + (Math.random() - 0.5) * 60;
            attempts++;
        }
        
        ghosts.push({ 
            x: gPos.x, 
            y: gPos.y, 
            angle: Math.PI
        });
    }

    generateDotsAndStars();

    showStory(getText(`l${currentLevel}_intro`));
    
    gameRunning = true;
    isPaused = true;
    updateHUD();
    requestAnimationFrame(gameLoop);
}

function createFallbackMask() {
    MASK_CTX.fillStyle = '#ffffff';
    MASK_CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);
    MASK_CTX.fillStyle = '#548064';
    MASK_CTX.fillRect(CANVAS.width - 150, 0, 150, CANVAS.height);
    console.log('✅ 备用遮罩已创建（包含绿色通关区域）');
}

function generateDotsAndStars() {
    dots = [];
    bigStars = [];
    let w = CANVAS.width;
    let h = CANVAS.height;

    for(let y = 60; y < h - 60; y += GRID_SIZE) {
        for(let x = 60; x < w - 60; x += GRID_SIZE) {
            if(!checkCollision(x, y, 8)) {
                dots.push({ 
                    x: x, 
                    y: y, 
                    active: true,
                    phase: Math.random() * Math.PI * 2,
                    freq: 0.05 + Math.random() * 0.05,
                    size: 8
                });
            }
        }
    }
    totalDots = dots.length;
    collectedDots = 0;

    let starSize = 30;
    let attempts = 0;
    let starPos = null;
    
    while(!starPos && attempts < 100) {
        let testX = w/2 + (Math.random() - 0.5) * 300;
        let testY = h/2 + (Math.random() - 0.5) * 200;
        if(!checkCollision(testX, testY, starSize)) {
            starPos = {x: testX, y: testY};
        }
        attempts++;
    }
    
    if(!starPos) {
        starPos = findSafeSpot(w/2, h/2, starSize);
    }
    
    bigStars.push({ 
        x: starPos.x, 
        y: starPos.y, 
        textKey: `l${currentLevel}_star1`, 
        active: true, 
        size: starSize,
        phase: Math.random() * Math.PI * 2,
        freq: 0.03 + Math.random() * 0.02
    });
}

function update() {
    if(!gameRunning || isPaused || player.isDead) return;

    animationFrame++;
    
    let dx = 0, dy = 0;
    isMoving = false;
    
    if (keys['ArrowUp']) { dy -= 1; isMoving = true; }
    if (keys['ArrowDown']) { dy += 1; isMoving = true; }
    if (keys['ArrowLeft']) { dx -= 1; isMoving = true; }
    if (keys['ArrowRight']) { dx += 1; isMoving = true; }
    
    if (joystick.active) {
        dx = joystick.dx;
        dy = joystick.dy;
        isMoving = Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1;
    }

    if (dx !== 0 || dy !== 0) {
        let len = Math.hypot(dx, dy);
        if (len > 0.1) {
            player.angle = Math.atan2(dy, dx);
            
            const config = LEVEL_CONFIG[currentLevel] || LEVEL_CONFIG[1];
            let pSpeed = config.p_speed;
            
            dx = (dx / len) * pSpeed;
            dy = (dy / len) * pSpeed;
            moveWithPhysics(player, dx, dy, HITBOX_SIZE);
        }
    }

    const config = LEVEL_CONFIG[currentLevel] || LEVEL_CONFIG[1];
    let gSpeed = config.g_speed;

    if (!player.isDead) {
        ghosts.forEach(g => {
            let tx = player.x - g.x;
            let ty = player.y - g.y;
            let dist = Math.hypot(tx, ty);
            let targetAngle = Math.atan2(ty, tx);

            g.angle = targetAngle;

            let nextX = g.x + Math.cos(g.angle) * gSpeed;
            let nextY = g.y + Math.sin(g.angle) * gSpeed;
            
            if (checkCollision(nextX, nextY, HITBOX_SIZE)) {
                let found = false;
                for (let offset = 0.5; offset < Math.PI * 2; offset += 0.5) {
                    let testAngle1 = g.angle + offset;
                    let testAngle2 = g.angle - offset;
                    
                    nextX = g.x + Math.cos(testAngle1) * gSpeed;
                    nextY = g.y + Math.sin(testAngle1) * gSpeed;
                    if (!checkCollision(nextX, nextY, HITBOX_SIZE)) {
                        g.angle = testAngle1;
                        found = true;
                        break;
                    }
                    
                    nextX = g.x + Math.cos(testAngle2) * gSpeed;
                    nextY = g.y + Math.sin(testAngle2) * gSpeed;
                    if (!checkCollision(nextX, nextY, HITBOX_SIZE)) {
                        g.angle = testAngle2;
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    g.angle += 0.1;
                    return;
                }
            }

            moveWithPhysics(g, Math.cos(g.angle) * gSpeed, Math.sin(g.angle) * gSpeed, HITBOX_SIZE);

            if (dist < HITBOX_SIZE + GHOST_SIZE && player.invulnerable <= 0) {
                playerHit();
            }
        });
    }

    if (player.invulnerable > 0) player.invulnerable--;

    dots.forEach(d => {
        if (d.active && Math.hypot(player.x - d.x, player.y - d.y) < HITBOX_SIZE + 12) {
            d.active = false;
            collectedDots++;
            playSound('dot');
            updateHUD();
        }
    });

    bigStars.forEach(s => {
        if (s.active && Math.hypot(player.x - s.x, player.y - s.y) < HITBOX_SIZE + 20) {
            s.active = false;
            playSound('bigStar');
            let text = getText(s.textKey);
            showStory(text);
        }
    });

    let progress = collectedDots / totalDots;
    if (progress >= 0.8 && checkWinArea(player.x, player.y)) {
        levelWin();
    }
}

function checkWinArea(x, y) {
    if (!MASK_CTX || x < 0 || x >= MASK_CANVAS.width || y < 0 || y >= MASK_CANVAS.height) return false;
    
    const pixelData = MASK_CTX.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
    const r = pixelData[0];
    const g = pixelData[1];
    const b = pixelData[2];
    
    const tolerance = 30;
    const isGreen = Math.abs(r - WIN_COLOR.r) < tolerance && 
                    Math.abs(g - WIN_COLOR.g) < tolerance && 
                    Math.abs(b - WIN_COLOR.b) < tolerance;
    
    if (isGreen) {
        const progress = collectedDots / totalDots;
        if (progress >= 0.8) {
            return true;
        } else {
            const required = Math.ceil(totalDots * 0.8);
            const remaining = required - collectedDots;
            alert(`还需要收集 ${remaining} 个星星！`);
            return false;
        }
    }
    
    return false;
}

function getDirectionFromAngle(angle) {
    const directions = ['right', 'down', 'left', 'up'];
    const index = Math.round(angle / (Math.PI / 2)) & 3;
    return directions[index];
}

function drawStar(x, y, size, color, star) {
    const blink = (Math.sin(animationFrame * star.freq + star.phase) + 1) * 0.5;
    const opacity = 0.4 + blink * 0.6;
    
    CTX.save();
    CTX.globalAlpha = opacity;
    CTX.fillStyle = color;
    
    const spikes = 5;
    const outerRadius = size;
    const innerRadius = size * 0.5;
    
    CTX.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        const angle = (i * Math.PI) / spikes;
        const px = x + Math.cos(angle) * radius;
        const py = y + Math.sin(angle) * radius;
        
        if (i === 0) {
            CTX.moveTo(px, py);
        } else {
            CTX.lineTo(px, py);
        }
    }
    CTX.closePath();
    CTX.fill();
    CTX.restore();
}

function draw() {
    if (!gameRunning || !CTX) return;
    
    CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
    
    if (bgImg && bgImg.loaded && bgImg.complete && bgImg.naturalWidth > 0) {
        try {
            CTX.drawImage(bgImg, 0, 0);
        } catch(e) {
            console.error('背景图绘制失败:', e);
        }
    } else {
        if (!window.bgDrawErrorLogged) {
            console.warn('⚠️ 背景图不可用，使用备用背景');
            window.bgDrawErrorLogged = true;
        }
        drawFallbackBackground();
    }

    dots.forEach(d => {
        if(d.active) {
            drawStar(d.x, d.y, 8, "#f9d71c", d);
        }
    });

    bigStars.forEach(s => {
        if(s.active) {
            CTX.shadowBlur = 15;
            CTX.shadowColor = "#f9d71c";
            drawStar(s.x, s.y, s.size || 12, "#fff", s);
            CTX.shadowBlur = 0;
        }
    });

    if (!player.isDead) {
        const playerDir = getDirectionFromAngle(player.angle);
        let playerFrame = 0;
        
        if (isMoving) {
            const currentTime = Date.now();
            playerFrame = Math.floor(currentTime / ANIMATION_SPEED) % 2;
        } else {
            playerFrame = 0;
        }
        
        let playerImgToDraw = null;
        if (playerImgs[playerDir] && playerImgs[playerDir][playerFrame]) {
            playerImgToDraw = playerImgs[playerDir][playerFrame];
        }
        
        if (playerImgToDraw && playerImgToDraw.complete && playerImgToDraw.src && playerImgToDraw.loaded !== false) {
            try {
                if (Math.floor(player.invulnerable / 5) % 2 === 0) {
                    CTX.drawImage(playerImgToDraw, 
                        player.x - PLAYER_SIZE, 
                        player.y - PLAYER_SIZE, 
                        PLAYER_SIZE * 2, 
                        PLAYER_SIZE * 2
                    );
                }
            } catch(e) {
                if (!window.playerDrawErrorLogged) {
                    console.log('玩家图片绘制失败，使用备用色块');
                    window.playerDrawErrorLogged = true;
                }
                if (Math.floor(player.invulnerable / 5) % 2 === 0) {
                    CTX.fillStyle = "#0ff";
                    CTX.fillRect(player.x - PLAYER_SIZE, player.y - PLAYER_SIZE, PLAYER_SIZE * 2, PLAYER_SIZE * 2);
                }
            }
        } else {
            if (Math.floor(player.invulnerable / 5) % 2 === 0) {
                CTX.fillStyle = "#0ff";
                CTX.fillRect(player.x - PLAYER_SIZE, player.y - PLAYER_SIZE, PLAYER_SIZE * 2, PLAYER_SIZE * 2);
            }
        }
    }

    if (!player.isDead) {
        ghosts.forEach((g, index) => {
            const ghostDir = getDirectionFromAngle(g.angle);
            let ghostFrame = Math.floor((animationFrame + index * 10) / ANIMATION_SPEED) % 2;
            
            let ghostImgToDraw = null;
            if (ghostImgs[ghostDir] && ghostImgs[ghostDir][ghostFrame]) {
                ghostImgToDraw = ghostImgs[ghostDir][ghostFrame];
            }
            
            CTX.save();
            CTX.translate(g.x, g.y);
            CTX.shadowBlur = 25;
            CTX.shadowColor = "#ff0000";
            
            if (ghostImgToDraw && ghostImgToDraw.complete && ghostImgToDraw.src && ghostImgToDraw.loaded !== false) {
                try {
                    CTX.drawImage(ghostImgToDraw, -GHOST_SIZE, -GHOST_SIZE, GHOST_SIZE * 2, GHOST_SIZE * 2);
                } catch(e) {
                    if (!window.ghostDrawErrorLogged) {
                        console.log('鬼魂图片绘制失败，使用备用图形');
                        window.ghostDrawErrorLogged = true;
                    }
                    drawGhostFallback();
                }
            } else {
                drawGhostFallback();
            }
            
            CTX.restore();
        });
    }
}

function drawFallbackBackground() {
    const gradient = CTX.createRadialGradient(
        CANVAS.width/2, CANVAS.height/2, 0,
        CANVAS.width/2, CANVAS.height/2, CANVAS.width/2
    );
    gradient.addColorStop(0, '#1a1a2e');
    gradient.addColorStop(1, '#0a0a1a');
    CTX.fillStyle = gradient;
    CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);
    
    for(let i = 0; i < 50; i++) {
        const x = Math.random() * CANVAS.width;
        const y = Math.random() * CANVAS.height;
        const size = Math.random() * 2 + 1;
        CTX.fillStyle = `rgba(249, 215, 28, ${Math.random() * 0.5 + 0.5})`;
        CTX.beginPath();
        CTX.arc(x, y, size, 0, Math.PI * 2);
        CTX.fill();
    }
}

function drawGhostFallback() {
    CTX.fillStyle = "#000";
    CTX.beginPath();
    CTX.arc(0, 0, GHOST_SIZE, 0, Math.PI * 2);
    CTX.fill();
    CTX.strokeStyle = "#f00";
    CTX.lineWidth = 2;
    CTX.beginPath();
    CTX.moveTo(0, 0);
    CTX.lineTo(20, 0);
    CTX.stroke();
}

function isWall(x, y) {
    if (x < 0 || x >= MASK_CANVAS.width || y < 0 || y >= MASK_CANVAS.height) return true;
    
    const pixelData = MASK_CTX.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
    const r = pixelData[0];
    const g = pixelData[1];
    const b = pixelData[2];
    
    const tolerance = 30;
    const isGreen = Math.abs(r - WIN_COLOR.r) < tolerance && 
                    Math.abs(g - WIN_COLOR.g) < tolerance && 
                    Math.abs(b - WIN_COLOR.b) < tolerance;
    
    if (isGreen) {
        const progress = collectedDots / totalDots;
        if (progress >= 0.8) {
            return false;
        } else {
            return true;
        }
    }
    
    return r < 120;
}

function checkCollision(x, y, size) {
    const margin = 2;
    const effectiveSize = HITBOX_SIZE + margin;
    const r = effectiveSize / 2;
    const centerX = x;
    const centerY = y;
    
    return isWall(centerX, centerY) || 
           isWall(centerX + r, centerY) || 
           isWall(centerX - r, centerY) || 
           isWall(centerX, centerY + r) || 
           isWall(centerX, centerY - r);
}

function moveWithPhysics(entity, dx, dy, size) {
    const steps = 4; 
    let sx = dx / steps;
    let sy = dy / steps;
    for(let i = 0; i < steps; i++) {
        if (!checkCollision(entity.x + sx, entity.y, HITBOX_SIZE)) {
            entity.x += sx;
        }
        if (!checkCollision(entity.x, entity.y + sy, HITBOX_SIZE)) {
            entity.y += sy;
        }
    }
}

function findSafeSpot(sx, sy, size) {
    let r = 0;
    while(r < 500) {
        for(let dx = -r; dx <= r; dx += 20) {
            for(let dy = -r; dy <= r; dy += 20) {
                if(!checkCollision(sx + dx, sy + dy, HITBOX_SIZE)) {
                    return {x: sx + dx, y: sy + dy};
                }
            }
        }
        r += 50;
    }
    return {x: sx, y: sy};
}

// ==================== ⚡ 玩家碰撞处理：防重复触发，防音效堆叠 ====================
function playerHit() {
    // ==================== 🔧 核心防护：如果已经死亡，直接返回，不再执行任何操作 ====================
    if (player.isDead) {
        console.log('⚠️ 玩家已死亡，playerHit 被阻止重复触发');
        return;
    }
    
    // ==================== 🔧 设置死亡标记，阻止后续碰撞检测 ====================
    player.isDead = true;
    gameRunning = false;
    lives--;
    
    // ==================== 🎵 只播放一次碰撞音效 ====================
    if (!SFX.collision.playing) {
        playSound('collision');
        SFX.collision.playing = true; // 防止重复播放标记
    }
    
    updateHUD();
    
    if (lives <= 0) {
        setTimeout(() => {
            if (bgMusicElement && musicPlaying) {
                bgMusicElement.pause();
            }
            // ==================== 🎵 游戏结束音效也只播放一次 ====================
            if (!SFX.gameOver.playing) {
                playSound('gameOver');
                SFX.gameOver.playing = true;
            }
            showResult(getText('game_over'), getText('btn_retry'), () => location.reload());
        }, 800);
    } else {
        player.invulnerable = 120;
        setTimeout(() => {
            // ==================== 🔧 重置标记，准备复活 ====================
            SFX.collision.playing = false;
            
            let safe = findSafeSpot(100, CANVAS.height/2, HITBOX_SIZE);
            player.x = safe.x;
            player.y = safe.y;
            
            ghosts.forEach((g, index) => {
                let ghostSafe = findSafeSpot(CANVAS.width - 200, 200 + index*150, HITBOX_SIZE);
                g.x = ghostSafe.x;
                g.y = ghostSafe.y;
            });
            
            alert(getText('hit_warning'));
            player.isDead = false; // 重置死亡状态
            gameRunning = true;
            isPaused = false;
        }, 800);
    }
}

function levelWin() {
    isPaused = true;
    gameRunning = false;
    const resultModal = document.getElementById('result-modal');
    if (resultModal) resultModal.classList.add('hidden');
    showLevelStory(currentLevel);
}

function showLevelStory(level) {
    const modal = document.getElementById('level-story-modal');
    const img = document.getElementById('story-bg-img');
    const content = document.getElementById('level-story-content');
    const btn = document.getElementById('story-btn-text');
    
    if (!modal || !content || !btn) return;
    
    btn.textContent = getText('next_btn');
    
    const storyIndex = level - 1;
    if (levelStoryImgs[storyIndex] && levelStoryImgs[storyIndex].loaded) {
        img.src = levelStoryImgs[storyIndex].src;
        img.style.display = 'block';
    } else {
        img.style.display = 'none';
    }
    
    const levelStory = getText(`level${level}_complete`);
    content.textContent = levelStory;
    
    modal.classList.remove('hidden');
    
    if (level === 3) {
        if (bgMusicElement && musicPlaying) {
            bgMusicElement.pause();
        }
        setTimeout(() => playSound('gameWin'), 500);
    }
}

function closeLevelStory() {
    const modal = document.getElementById('level-story-modal');
    if (modal) modal.classList.add('hidden');
    
    if (currentLevel < 3) {
        if (bgMusicElement && musicPlaying && bgMusicElement.paused) {
            bgMusicElement.play().catch(e => console.log('恢复音乐失败', e));
        }
        initLevel(currentLevel + 1);
    } else {
        showEndingScreen();
    }
}

function showStory(text) {
    isPaused = true;
    const modal = document.getElementById('story-modal');
    const content = document.getElementById('story-content');
    if (modal && content) {
        content.innerText = text;
        modal.classList.remove('hidden');
    }
}

function closeStory() {
    const modal = document.getElementById('story-modal');
    if (modal) modal.classList.add('hidden');
    isPaused = false;
}

function showResult(title, btnText, callback) {
    const modal = document.getElementById('result-modal');
    const titleEl = document.getElementById('result-title');
    const btn = document.getElementById('next-btn');
    
    if (modal && titleEl && btn) {
        titleEl.innerText = title;
        btn.innerText = btnText;
        btn.onclick = callback;
        modal.classList.remove('hidden');
    }
}

function showEndingScreen() {
    const container = document.getElementById('canvas-container');
    if (container) container.style.display = 'none';
    
    const musicBtn = document.getElementById('music-btn');
    if (musicBtn) musicBtn.style.display = 'none';
    
    const creditsContent = document.getElementById('credits-content');
    if (creditsContent) {
        creditsContent.innerHTML = getText('ending_credits');
    }
    
    const endingScreen = document.getElementById('ending-screen');
    if (endingScreen) {
        endingScreen.classList.remove('hidden');
    }
    
    // ==================== 🎵 胜利音效只播放一次 ====================
    playSound('gameWin');
    
    setTimeout(() => {
        if (confirm(getText('btn_retry') + '?')) {
            location.reload();
        }
    }, 45000);
}

function updateHUD() {
    const livesEl = document.getElementById('lives');
    const collectEl = document.getElementById('collect-text');
    const levelEl = document.getElementById('level-num');
    
    if (livesEl) {
        let hearts = "";
        for(let i = 0; i < lives; i++) hearts += "❤️";
        livesEl.innerHTML = hearts;
    }
    
    if (collectEl) {
        let pct = Math.floor((collectedDots / totalDots) * 100);
        collectEl.innerText = isNaN(pct) ? "0%" : pct + "%";
    }
    
    if (levelEl) {
        levelEl.innerText = currentLevel;
    }
}

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');

if (joyZone && joyKnob) {
    joyZone.addEventListener('touchstart', e => {
        e.preventDefault();
        e.stopPropagation();
        let touch = e.touches[0];
        let rect = joyZone.getBoundingClientRect();
        joystick.active = true;
        joystick.originX = rect.left + rect.width/2;
        joystick.originY = rect.top + rect.height/2;
        updateJoystick(touch.clientX, touch.clientY);
    }, {passive: false, capture: true});

    joyZone.addEventListener('touchmove', e => {
        e.preventDefault();
        e.stopPropagation();
        if(joystick.active) updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: false, capture: true});

    joyZone.addEventListener('touchend', e => {
        e.preventDefault();
        e.stopPropagation();
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
        joyKnob.style.transform = `translate(-50%, -50%)`;
        isMoving = false;
    }, {passive: false, capture: true});
}

function updateJoystick(x, y) {
    let maxDist = 30;
    let dx = x - joystick.originX;
    let dy = y - joystick.originY;
    let dist = Math.hypot(dx, dy);
    
    if(dist > maxDist) {
        dx = (dx/dist) * maxDist;
        dy = (dy/dist) * maxDist;
    }
    joystick.dx = dx / maxDist;
    joystick.dy = dy / maxDist;
    
    joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    isMoving = Math.abs(joystick.dx) > 0.1 || Math.abs(joystick.dy) > 0.1;
}

function gameLoop() {
    animationFrame++;
    update();
    draw();
    frameId = requestAnimationFrame(gameLoop);
}
